<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalo Data Stream - Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --bot-bg: rgba(59, 130, 246, 0.15);
            --bot-border: rgba(59, 130, 246, 0.3);
            --user-bg: rgba(255, 255, 255, 0.05);
            --user-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            padding: 24px 32px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .controls {
            display: flex;
            gap: 16px;
        }

        .search-bar {
            padding: 10px 16px;
            border-radius: 99px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-family: inherit;
            outline: none;
            width: 250px;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            width: 300px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        .chat-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .msg-sender {
            font-weight: 600;
            color: #e2e8f0;
        }

        .msg-group {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
        }

        .msg-bubble {
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
            border: 1px solid;
            position: relative;
        }

        .message.user {
            align-self: flex-start;
        }
        .message.user .msg-bubble {
            background: var(--user-bg);
            border-color: var(--user-border);
            border-top-left-radius: 4px;
        }

        .message.bot {
            align-self: flex-end;
        }
        .message.bot .msg-meta {
            flex-direction: row-reverse;
        }
        .message.bot .msg-bubble {
            background: var(--bot-bg);
            border-color: var(--bot-border);
            border-top-right-radius: 4px;
            box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.05);
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            padding: 20px;
        }

        .chat-input-container {
            padding: 20px 32px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 16px;
            background: rgba(15, 23, 42, 0.6);
        }

        .chat-input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .chat-btn {
            padding: 0 24px;
            border-radius: 12px;
            border: none;
            background: var(--accent);
            color: white;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .chat-btn:active {
            transform: translateY(0);
        }

        .ai-message {
            display: flex;
            flex-direction: column;
            max-width: 90%;
            align-self: center;
            margin: 10px 0;
            animation: fadeIn 0.3s ease forwards;
            width: 100%;
        }

        .ai-bubble {
            padding: 20px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #e2e8f0;
            box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.2);
        }

        .ai-title {
            font-weight: 700;
            color: #a78bfa;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }

        .typing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
        }

        .typing-indicator span {
            width: 4px;
            height: 4px;
            background-color: #a78bfa;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><div class="status-dot"></div> Zalo Intelligence Stream</h1>
            <div class="controls">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search logs by sender or text...">
            </div>
        </div>
        <div class="chat-container" id="chatContainer">
            <div class="loading">Establishing secure connection to Data Stream...</div>
        </div>
        <div class="chat-input-container">
            <input type="text" id="aiInput" class="chat-input" placeholder="Yêu cầu AI phân tích (Ví dụ: Nãy giờ Thắng nói gì?)..." onkeypress="handleEnter(event)">
            <button class="chat-btn" onclick="askAI()">
                <span>✨ Hỏi AI</span>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const searchInput = document.getElementById('searchInput');
        const aiInput = document.getElementById('aiInput');
        let allMessages = [];
        let aiConversations = [];
        let lastId = null;

        function formatTime(timestamp) {
            const ms = timestamp > 9999999999999 ? Math.floor(timestamp / 1000) : timestamp;
            const date = new Date(ms);
            return date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' - ' + date.toLocaleDateString('vi-VN');
        }

        function isBot(senderName) {
            return senderName.toLowerCase().includes('bot') || senderName.toLowerCase().includes('assistant');
        }

        function renderMessages(messagesToRender) {
            if (messagesToRender.length === 0 && aiConversations.length === 0) {
                chatContainer.innerHTML = '<div class="empty-state">No messages found in the stream.</div>';
                return;
            }

            chatContainer.innerHTML = '';
            
            // Reverse so oldest is top, newest is bottom
            const displayMsgs = [...messagesToRender].reverse();

            displayMsgs.forEach(msg => {
                const isBotMsg = isBot(msg.sender_name);
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${isBotMsg ? 'bot' : 'user'}`;
                
                const metaDiv = document.createElement('div');
                metaDiv.className = 'msg-meta';
                
                const senderSpan = document.createElement('span');
                senderSpan.className = 'msg-sender';
                senderSpan.textContent = msg.sender_name || 'Unknown User';

                const timeSpan = document.createElement('span');
                timeSpan.textContent = formatTime(msg.timestamp);

                const groupSpan = document.createElement('span');
                groupSpan.className = 'msg-group';
                groupSpan.textContent = (msg.group_name && msg.group_name !== msg.sender_name) ? msg.group_name : 'Direct';

                if (isBotMsg) {
                    metaDiv.appendChild(timeSpan);
                    metaDiv.appendChild(groupSpan);
                    metaDiv.appendChild(senderSpan);
                } else {
                    metaDiv.appendChild(senderSpan);
                    metaDiv.appendChild(groupSpan);
                    metaDiv.appendChild(timeSpan);
                }

                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'msg-bubble';
                bubbleDiv.textContent = msg.text;

                msgDiv.appendChild(metaDiv);
                msgDiv.appendChild(bubbleDiv);
                
                chatContainer.appendChild(msgDiv);
            });

            // Append AI Conversations at the bottom
            aiConversations.forEach(conv => {
                const div = document.createElement('div');
                div.className = 'ai-message';
                
                let html = `<div class="ai-bubble"><div class="ai-title">🧠 Báo cáo Phân tích AI</div>`;
                html += `<b>Sếp hỏi:</b> ${conv.question}<br><br>`;
                if (conv.loading) {
                    html += `<b>AI Trả lời:</b> Đang suy nghĩ <div class="typing-indicator"><span></span><span></span><span></span></div>`;
                } else {
                    html += `<b>AI Trả lời:</b>\n${conv.answer}`;
                }
                html += `</div>`;
                div.innerHTML = html;
                chatContainer.appendChild(div);
            });
        }

        function filterMessages() {
            const query = searchInput.value.toLowerCase();
            if (!query) {
                renderMessages(allMessages);
                return;
            }
            const filtered = allMessages.filter(m => 
                (m.text && m.text.toLowerCase().includes(query)) || 
                (m.sender_name && m.sender_name.toLowerCase().includes(query))
            );
            renderMessages(filtered);
        }

        searchInput.addEventListener('input', filterMessages);

        async function fetchLogs() {
            try {
                const response = await fetch('/api/chat-logs');
                const data = await response.json();
                
                // Only re-render if data length changed to avoid flickering while AI is typing
                if (data.length !== allMessages.length || JSON.stringify(data[0]) !== JSON.stringify(allMessages[0])) {
                    allMessages = data;
                    const isScrolledToBottom = chatContainer.scrollHeight - chatContainer.clientHeight <= chatContainer.scrollTop + 100;
                    
                    filterMessages();
                    
                    if (isScrolledToBottom || lastId === null) {
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                    lastId = data.length > 0 ? data[0].id : null;
                }
            } catch (error) {
                console.error("Error fetching logs:", error);
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                askAI();
            }
        }

        async function askAI() {
            const text = aiInput.value.trim();
            if (!text) return;
            
            aiInput.value = '';
            
            // Add loading conversation
            const conv = { question: text, answer: '', loading: true };
            aiConversations.push(conv);
            filterMessages();
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/ask-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                
                const data = await response.json();
                conv.answer = data.reply || "Lỗi không nhận được phản hồi.";
            } catch (err) {
                conv.answer = "Lỗi kết nối đến Server AI: " + err.message;
            } finally {
                conv.loading = false;
                filterMessages();
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // Initial fetch
        fetchLogs();
        
        // Auto refresh every 5 seconds
        setInterval(fetchLogs, 5000);
    </script>
</body>
</html>
